name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore AppMigrate.sln
      - name: Build
        run: dotnet build AppMigrate.sln -c Release --no-restore
      - name: Publish framework-dependent
        run: >
          dotnet publish src/AppMigrate/AppMigrate.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o dist/win-x64
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppMigrate-win-x64
          path: dist/win-x64
          if-no-files-found: error
